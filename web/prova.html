<!DOCTYPE html>
<html lang="it">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Prova di compilazione</title></head>
<body style="font:16px/1.5 system-ui;margin:20px">
<!-- A diagnosis (2026-10-31, an iPhone whose page dies as the game starts):
     only downloads and compiles the game's wasm, as index.html does, and draws
     nothing. If this page dies too, the compilation is to blame, not the scene. -->
<pre id="out" style="white-space:pre-wrap">…</pre>
<script>
  const out = document.getElementById('out');
  const t0 = performance.now();
  const say = s => { out.textContent += '\n' + ((performance.now() - t0) / 1000).toFixed(1) + ' s ' + s; };
  out.textContent = navigator.userAgent;
  (async () => {
    const zipped = typeof DecompressionStream === 'function';
    const r = await fetch(zipped ? './game_bg.wasm.gz' : './game_bg.wasm', { cache: 'no-store' });
    say('download ' + r.status);
    const body = zipped ? r.body.pipeThrough(new DecompressionStream('gzip')) : r.body;
    const module = await WebAssembly.compileStreaming(new Response(body, { headers: { 'Content-Type': 'application/wasm' } }));
    window.keep = module;
    say('compilato: ' + WebAssembly.Module.exports(module).length + ' export');
    setTimeout(() => say('vivo dopo 10 s: la compilazione non basta a far morire la pagina'), 10000);
  })().catch(e => say('errore: ' + e));
</script>
</body>
</html>
