name: Publish the browser build

on:
  push:
    branches: [main, settimana-protezione-civile, nuovo-gioco]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_DEPLOY: ${{ secrets.DEPLOY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      # wasm-opt (binaryen) shrinks the wasm; build_web.sh uses it when found
      - name: Install wasm-opt
        run: |
          v=version_133
          f=binaryen-$v-x86_64-linux.tar.gz
          curl -sSLO https://github.com/WebAssembly/binaryen/releases/download/$v/$f
          curl -sSL https://github.com/WebAssembly/binaryen/releases/download/$v/$f.sha256 | awk '{print $1"  '"$f"'"}' | sha256sum -c
          tar xzf $f
          echo "$PWD/binaryen-$v/bin" >> "$GITHUB_PATH"
      - run: ./scripts/build_web.sh
      # games.cimafoundation.org/isola-di-roccavento: CIMA hosting (Ergonet),
      # FTPS with password, certificate checked (docs/web.md). Only from main.
      - name: Upload to games.cimafoundation.org
        if: github.ref == 'refs/heads/main' && env.HAS_DEPLOY == 'true'
        continue-on-error: true  # the Pages deploy below must not depend on it
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || 'isola-di-roccavento' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -e "set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate true; \
            set net:max-retries 3; mirror --reverse --delete --parallel=4 --verbose target/web $DEPLOY_DIR; quit" \
            -u "$DEPLOY_USER,$DEPLOY_PASSWORD" "ftp://$DEPLOY_HOST"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
