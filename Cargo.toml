[workspace]
resolver = "2"
members = ["crates/scenario", "crates/fire", "crates/abm", "crates/game", "crates/behavior", "crates/rocca", "crates/datafs", "crates/libsm64-native", "crates/sfx"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "EUPL-1.2"

[workspace.dependencies]
# The PROPAGATOR core, from CIMAFoundation/propagator_sim (rust/propagator-core),
# pinned to a commit of its dev branch. To move the pin: change `rev` and run
# `cargo update -p propagator-core`.
propagator-core = { git = "https://github.com/CIMAFoundation/propagator_sim.git", rev = "ea046d1da82f4f638154cdeb32250ca8fc4f3def" }

scenario = { path = "crates/scenario" }
fire = { path = "crates/fire" }
abm = { path = "crates/abm" }
behavior = { path = "crates/behavior" }
rocca = { path = "crates/rocca" }
datafs = { path = "crates/datafs" }
sfx = { path = "crates/sfx" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rand = "0.8"
rand_chacha = "0.3"
# Bevy's window/event stack brings in uuid and getrandom; in the browser they
# need the Web Crypto source.
uuid = { version = "1", features = ["js"] }
getrandom = { version = "0.3", features = ["wasm_js"] }

[profile.dev]
opt-level = 1

# The fire core and asset decoding are unusably slow in a debug build.
[profile.dev.package."*"]
opt-level = 3

# The browser build (`scripts/build_web.sh`): small and fast.
[profile.wasm-release]
inherits = "release"
# z and full LTO: the smallest code (2026-10-30, the iPhone's memory)
opt-level = "z"
lto = true
codegen-units = 1
# Drop the 60 MB wasm "name" section.
strip = "symbols"
