[target.wasm32-unknown-unknown]
# getrandom 0.3 (pulled in by Bevy's web event stack) requires an explicit
# opt-in to the browser Web Crypto backend.
# The memory starts at 448 MiB (320 from 2026-10-31, iPhone pages dying as
# the scene was built): grown a little at a time from 1 MiB, Safari on iOS
# may copy the whole memory at each step, twice the memory at the peak.
# Untouched pages cost nothing. The game needs under 320 MiB on a phone, and
# 376 with the realistic style (`?scans=1`, 2026-11-13, measured with
# scripts/web_budget.py): 448 leaves it room without a single step.
rustflags = ['--cfg', 'getrandom_backend="wasm_js"', '-C', 'link-arg=--initial-memory=469762048']
